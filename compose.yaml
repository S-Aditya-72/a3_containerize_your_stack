services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:dev@db:5432/tasks
    depends_on:
      - db

  db:
    # We use version 17 just like you successfully did in Stage 0!
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=dev
      - POSTGRES_DB=tasks
    ports:                 
      - "5432:5432" 
    volumes:
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata: